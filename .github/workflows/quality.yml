name: Pamuk Eller kalite kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript ve üretim derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        run: npm install
      - name: Bağımlılık güvenlik raporu
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r=JSON.parse(require("fs").readFileSync("npm-audit.json","utf8")); console.log("AUDIT_TOTALS",JSON.stringify(r.metadata?.vulnerabilities||{})); for(const [name,v] of Object.entries(r.vulnerabilities||{})) console.log("AUDIT_PACKAGE",name,"severity="+v.severity,"direct="+v.isDirect,"range="+v.range,"via="+JSON.stringify(v.via),"nodes="+JSON.stringify(v.nodes),"fix="+JSON.stringify(v.fixAvailable));'
      - name: Güvenlik kapısı
        run: npm audit --audit-level=moderate
      - name: TypeScript kontrolü
        run: npm run typecheck
      - name: Üretim derlemesi
        run: npm run build
