name: Pamuk Eller kalite kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript ve üretim derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bağımlılıkları kur
        run: npm install
      - name: TypeScript kontrolü
        run: npm run typecheck
      - name: Üretim derlemesi
        run: npm run build
