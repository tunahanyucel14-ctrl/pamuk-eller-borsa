name: Pamuk Eller kalite kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript ve üretim derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        run: npm install
      - name: Bağımlılık güvenlik raporu
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r=JSON.parse(require("fs").readFileSync("npm-audit.json","utf8")); console.log("AUDIT_TOTALS",JSON.stringify(r.metadata?.vulnerabilities||{})); for(const [name,v] of Object.entries(r.vulnerabilities||{})) console.log("AUDIT_PACKAGE",name,"severity="+v.severity,"direct="+v.isDirect,"range="+v.range,"via="+JSON.stringify(v.via),"nodes="+JSON.stringify(v.nodes),"fix="+JSON.stringify(v.fixAvailable));'
      - name: Güvenlik kapısı
        run: npm audit --audit-level=moderate
      - name: Banka tanıma regresyon testleri
        run: npm test
      - name: TypeScript kontrolü
        run: npm run typecheck
      - name: Üretim derlemesi
        run: npm run build
      - name: Üretim sunucusu duman testi
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/pamuk-eller-next.log 2>&1 &
          echo $! > /tmp/pamuk-eller-next.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/pamuk-eller-health.json; then
              break
            fi
            sleep 2
          done
          node -e 'const fs=require("fs"); const health=JSON.parse(fs.readFileSync("/tmp/pamuk-eller-health.json","utf8")); if(health.ok!==true || health.service!=="pamuk-eller") process.exit(1); console.log("HEALTH_OK",health.service,health.timestamp);'
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
